name: Store assets

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: store-assets
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.44.4
  PLANKA_VERSION: 2.2.1

jobs:
  android-screenshots:
    name: Android screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Start seeded Planka
        run: |
          docker compose -f dev/docker-compose.yml up -d
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/terms >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker compose -f dev/docker-compose.yml logs
            exit 1
          fi
          PLANKA_URL=http://127.0.0.1:3000 ./dev/seed_demo.sh
      - name: Capture on a 16:9 Android phone
        uses: reactivecircus/android-emulator-runner@v2.38.0
        env:
          PLANKA_URL: http://10.0.2.2:3000
          PLANKA_EMAIL: demo@demo.demo
          PLANKA_PASSWORD: demo
          SCREENSHOT_OUTPUT_DIR: ${{ runner.temp }}/store-android
          STORE_SCREENSHOTS: '1'
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            mkdir -p "$SCREENSHOT_OUTPUT_DIR"
            flutter drive \
              --driver=test_driver/screenshots_driver.dart \
              --target=integration_test/screenshots_test.dart \
              -d emulator-5554 \
              --dart-define=PLANKA_URL=$PLANKA_URL \
              --dart-define=PLANKA_EMAIL=$PLANKA_EMAIL \
              --dart-define=PLANKA_PASSWORD=$PLANKA_PASSWORD
      - uses: actions/upload-artifact@v4
        with:
          name: store-android-screenshots
          path: ${{ runner.temp }}/store-android
          if-no-files-found: error

  ios-screenshots:
    name: iPhone and iPad screenshots
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Start native seeded Planka
        env:
          PLANKA_VERSION: ${{ env.PLANKA_VERSION }}
        run: |
          if brew list postgresql@16 >/dev/null 2>&1; then
            export PATH="$(brew --prefix postgresql@16)/bin:$PATH"
            brew services start postgresql@16
          elif brew list postgresql >/dev/null 2>&1; then
            export PATH="$(brew --prefix postgresql)/bin:$PATH"
            brew services start postgresql
          else
            brew install postgresql@16
            export PATH="$(brew --prefix postgresql@16)/bin:$PATH"
            brew services start postgresql@16
          fi
          postgres_ready=0
          for attempt in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 >/dev/null 2>&1; then
              postgres_ready=1
              break
            fi
            sleep 2
          done
          if [ "$postgres_ready" -ne 1 ]; then
            pg_isready -h 127.0.0.1
            exit 1
          fi
          createdb -h 127.0.0.1 -U "$(whoami)" planka 2>/dev/null || true

          server_root="$RUNNER_TEMP/planka-server"
          git clone --depth 1 --branch "v$PLANKA_VERSION" \
            https://github.com/plankanban/planka.git "$server_root"
          npm ci --prefix "$server_root/server"

          export BASE_URL=http://127.0.0.1:1337
          export PORT=1337
          export DATABASE_URL="postgresql://$(whoami)@127.0.0.1/planka"
          export SECRET_KEY=store-capture-only
          export DEFAULT_ADMIN_EMAIL=demo@demo.demo
          export DEFAULT_ADMIN_PASSWORD=demo
          export DEFAULT_ADMIN_NAME=Demo
          export DEFAULT_ADMIN_USERNAME=demo
          npm run db:init --prefix "$server_root/server"
          nohup npm run start:prod --prefix "$server_root/server" \
            >"$RUNNER_TEMP/planka-server.log" 2>&1 &

          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS "$BASE_URL/api/terms" >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            tail -200 "$RUNNER_TEMP/planka-server.log"
            exit 1
          fi
          {
            echo "PLANKA_URL=$BASE_URL"
            echo "PLANKA_EMAIL=demo@demo.demo"
            echo "PLANKA_PASSWORD=demo"
          } >>"$GITHUB_ENV"
      - name: Seed demo content
        run: ./dev/seed_demo.sh
      - name: Capture iPhone 16 Pro Max
        run: |
          device_id=$(xcrun simctl list devices available | \
            grep -m1 'iPhone 16 Pro Max' | grep -oE '[0-9A-Fa-f-]{36}' | head -1)
          test -n "$device_id"
          xcrun simctl boot "$device_id" 2>/dev/null || true
          xcrun simctl bootstatus "$device_id" -b
          mkdir -p "$RUNNER_TEMP/store-ios/iphone"
          SCREENSHOT_OUTPUT_DIR="$RUNNER_TEMP/store-ios/iphone" \
            STORE_SCREENSHOTS=1 flutter drive \
              --driver=test_driver/screenshots_driver.dart \
              --target=integration_test/screenshots_test.dart \
              -d "$device_id" \
              --dart-define=PLANKA_URL=$PLANKA_URL \
              --dart-define=PLANKA_EMAIL=$PLANKA_EMAIL \
              --dart-define=PLANKA_PASSWORD=$PLANKA_PASSWORD
      - name: Capture iPad Pro 13-inch (M4)
        run: |
          device_id=$(xcrun simctl list devices available | \
            grep -m1 'iPad Pro 13-inch (M4)' | grep -oE '[0-9A-Fa-f-]{36}' | head -1)
          test -n "$device_id"
          xcrun simctl boot "$device_id" 2>/dev/null || true
          xcrun simctl bootstatus "$device_id" -b
          mkdir -p "$RUNNER_TEMP/store-ios/ipad"
          SCREENSHOT_OUTPUT_DIR="$RUNNER_TEMP/store-ios/ipad" \
            STORE_SCREENSHOTS=1 flutter drive \
              --driver=test_driver/screenshots_driver.dart \
              --target=integration_test/screenshots_test.dart \
              -d "$device_id" \
              --dart-define=PLANKA_URL=$PLANKA_URL \
              --dart-define=PLANKA_EMAIL=$PLANKA_EMAIL \
              --dart-define=PLANKA_PASSWORD=$PLANKA_PASSWORD
      - uses: actions/upload-artifact@v4
        with:
          name: store-ios-screenshots
          path: ${{ runner.temp }}/store-ios
          if-no-files-found: error

  commit-assets:
    name: Open asset update PR
    needs: [android-screenshots, ios-screenshots]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: store-android-screenshots
          path: .store-captures/android
      - uses: actions/download-artifact@v4
        with:
          name: store-ios-screenshots
          path: .store-captures/ios
      - name: Install captures into fastlane trees
        run: |
          set -euo pipefail
          mkdir -p fastlane/metadata/android/en-US/images/phoneScreenshots
          mkdir -p fastlane/screenshots/en-US
          for screen in projects board card notifications; do
            cp ".store-captures/android/$screen.png" \
              "fastlane/metadata/android/en-US/images/phoneScreenshots/android_$screen.png"
            cp ".store-captures/ios/iphone/$screen.png" \
              "fastlane/screenshots/en-US/iphone_$screen.png"
            cp ".store-captures/ios/ipad/$screen.png" \
              "fastlane/screenshots/en-US/ipad_$screen.png"
          done
      - name: Generate and validate graphics and screenshots
        run: |
          python3 dev/generate_store_graphics.py
          python3 dev/validate_store_assets.py
      - name: Commit assets and open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          branch="store-assets/${GITHUB_RUN_ID}"
          git switch --create "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fastlane/metadata fastlane/screenshots/en-US
          if git diff --cached --quiet; then
            echo 'No store asset changes.'
            exit 0
          fi
          git commit -m 'build(store): capture listing assets'
          git push --set-upstream origin "$branch"
          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$branch" \
            --title 'build(store): capture listing assets' \
            --body $'Generated by the deliberate Store assets workflow.\n\nCloses MAIN-475'
