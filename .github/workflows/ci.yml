name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart analyze
      - run: flutter test

  # Analysis and widget tests never compile the real app, so a breakage that
  # only shows up at build time (assets, manifest, platform config, codegen)
  # used to reach a release tag unnoticed. Debug APK: no signing secrets, and
  # a single ABI keeps it the cheapest build that exercises lib/main.dart.
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Android APK (debug)
        run: flutter build apk --debug --target-platform android-arm64
