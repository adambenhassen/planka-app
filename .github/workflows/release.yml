name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.44.4

jobs:
  # Create the GitHub Release as a draft; platform jobs upload their
  # artifacts to it and the publish job flips it public once all succeed.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" --generate-notes --draft

  # Signed with the stable upload keystore (repo secrets) so sideloaded
  # updates install over the previous version. Missing secrets → debug key.
  android:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Restore release keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "no keystore secret; building debug-signed"
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > android/app/upload-keystore.jks
          echo "$KEY_PROPERTIES" > android/key.properties
      - run: flutter pub get
      - run: flutter build apk --release --flavor github
      - name: Upload APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv build/app/outputs/flutter-apk/app-github-release.apk planka-android.apk
          gh release upload "$GITHUB_REF_NAME" planka-android.apk --clobber
      # Play takes an AAB, not an APK, and rejects the self-install
      # permission the sideloaded flavor carries. Kept off the public release
      # page — it is an upload-signed artifact for the Play Console only.
      - run: |
          flutter build appbundle --release --flavor store \
            --dart-define=ENABLE_IN_APP_UPDATER=false
      - name: Upload Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: planka-play-appbundle
          path: build/app/outputs/bundle/storeRelease/app-store-release.aab
          if-no-files-found: error

  # Unsigned archive: proves the iOS build is green and gives App Store
  # Connect something to sign once Adam's certificates exist. Not
  # distributable as-is — `flutter build ipa` cannot export without them.
  ios:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ipa --release --no-codesign
      - name: Package archive
        run: |
          ditto -c -k --keepParent \
            build/ios/archive/Runner.xcarchive planka-ios-unsigned-xcarchive.zip
      - uses: actions/upload-artifact@v4
        with:
          name: planka-ios-unsigned-xcarchive
          path: planka-ios-unsigned-xcarchive.zip
          if-no-files-found: error

  # Universal (arm64 + x86_64) macOS app. Unsigned — Gatekeeper will warn;
  # right-click > Open, or remove the quarantine attribute to run.
  macos:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          ditto -c -k --keepParent "$APP" planka-macos-universal.zip
          gh release upload "$GITHUB_REF_NAME" planka-macos-universal.zip --clobber

  # The repo has no windows/ platform, so scaffold it in CI before building.
  windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter create --platforms=windows .
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath planka-windows-x64.zip
          gh release upload $env:GITHUB_REF_NAME planka-windows-x64.zip --clobber

  # Publish only once every platform artifact is attached.
  publish-release:
    needs: [android, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
